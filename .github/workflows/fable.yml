name: fable

# Worker-side deep extraction in CI: drains pending `extract` tasks with the
# episteme-fable engine (see WORKER.md, "Rubric — extract tasks").
#
# NOT SCHEDULED since 2026-10-29. The keyless provider (GitHub Models) was
# retired 2026-07-30 and every scheduled drain from then until 2026-10-29
# skipped its tasks silently (HTTP 410). By the owner's decision the daily
# drain does NOT run on the Max plan's API credits; the accrued backlog is
# drained locally (`EPF_PROVIDER=anthropic python -m mole fable --drain N`)
# and new extract tasks accrue until the next manual drain. The drain now
# fails loudly when nothing is extracted, so a dead provider cannot hide.
# Manual dispatch still works; provider by available secret:
#   ANTHROPIC_API_KEY        — direct Messages API (EPF_PROVIDER=anthropic)
#   CLAUDE_CODE_OAUTH_TOKEN  — `claude setup-token`; runs the claude CLI
# Bench parity (12-doc gold set): haiku F1 0.869 vs gpt-4.1-mini F1 0.865.

on:
  # schedule removed 2026-10-29 (see header); re-add a cron here only with a
  # provider the owner wants running unattended.
  workflow_dispatch:
    inputs:
      drain:
        description: "How many extract tasks to drain"
        default: "20"

# Same group as mole.yml: a drain never runs concurrently with the daily
# ingest (both rewrite queue/pending.jsonl). mole has cancel-in-progress and
# may preempt a running drain — safe, tasks stay pending and re-drain.
concurrency:
  group: mole-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: parallax1s/episteme-fable
          path: episteme-fable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select provider
        id: provider
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "kind=anthropic" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "kind=claude" >> "$GITHUB_OUTPUT"
          else
            echo "kind=github" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.provider.outputs.kind == 'claude'
        with:
          node-version: "20"

      - name: Install claude CLI
        if: steps.provider.outputs.kind == 'claude'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: pip install -e '.[all]'

      - name: Drain extract tasks
        env:
          EPISTEME_FABLE_SRC: ${{ github.workspace }}/episteme-fable/src
          EPF_PROVIDER: ${{ steps.provider.outputs.kind }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          DRAIN="${{ github.event.inputs.drain || '20' }}"
          python -m mole fable --drain "$DRAIN" --run-id "fable-ci-${GITHUB_RUN_ID}"

      - name: Commit drain outputs
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # never commit the engine checkout
          git add data queue
          if ! git diff --quiet --cached --exit-code; then
            git commit -m "fable: automated drain ${GITHUB_RUN_ID}"
            for i in 1 2 3; do
              git push && break
              git pull --rebase && continue
            done
          fi
