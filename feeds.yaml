feeds:
  - key: lesswrong-af
    kind: graphql-forum
    url: https://www.alignmentforum.org/graphql
    view: new
    limit: 25
  - key: arxiv-csai
    kind: arxiv
    query: cat:cs.AI AND (alignment OR "AI safety")
    limit: 25
  - key: blog-rss
    kind: rss
    url: https://thezvi.substack.com/feed
    limit: 10
  - key: cold-takes
    kind: rss
    url: https://www.cold-takes.com/rss/
    limit: 15
  # epoch.ai removed its RSS feed in a site redesign (rss.xml / index.xml /
  # atom.xml all 404, no <link rel=alternate> on the site as of 2026-07).
  # Re-enable if they publish a feed again.
  # - key: epoch-blog
  #   kind: rss
  #   url: https://epoch.ai/rss.xml
  #   limit: 15
  - key: christiano-alignment
    kind: rss
    # ai-alignment.com (Medium custom domain) times out consistently; this is
    # the same author's Medium feed, which carries the ai-alignment.com posts.
    url: https://medium.com/feed/@paulfchristiano
    limit: 15
  - key: arxiv-aligncs
    kind: arxiv
    query: all:"alignment faking" OR all:"scalable oversight" OR all:"AI control"
    limit: 25
